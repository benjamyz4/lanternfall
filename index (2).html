h1,h2,.sc{font-family:'Cormorant SC',Georgia,serif;letter-spacing:.04em;font-weight:700}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;padding:22px 5vw 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:2.6rem;line-height:1}
h1 small{display:block;font-size:.95rem;font-family:Spectral,serif;font-style:italic;font-weight:400;letter-spacing:0;color:var(--mute);margin-top:4px}
.stats{display:flex;gap:22px;flex-wrap:wrap}.stats div{font-size:.85rem;color:var(--mute)}.stats b{display:block;font-size:1.5rem;color:var(--ink);font-family:'Cormorant SC',serif}
main{padding:22px 5vw 60px;max-width:1200px;margin:auto}
.stage{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
@media(max-width:760px){.stage{grid-template-columns:1fr}}
.shop{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:4px}
.shop p{font-size:.9rem;color:var(--mute);margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--brass);background:transparent;color:var(--ink);padding:9px 14px;border-radius:3px}
button:hover:not(:disabled){background:var(--brass);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.big{width:100%;padding:12px;font-size:1.05rem;font-family:'Cormorant SC',serif;font-weight:700}
.pack{width:150px;height:210px;margin:6px auto 14px;background:linear-gradient(160deg,#17353b,#0a1a1e 60%,#2a1d0b);border:2px solid #c9a45c;border-radius:6px;position:relative;display:grid;place-items:center;color:#e8d9a8;box-shadow:0 10px 24px #0006;text-align:center;font-family:'Cormorant SC',serif}
.pack svg{position:absolute;inset:0;opacity:.5}.pack span{position:relative;font-size:1.5rem;line-height:1.1}.pack small{display:block;font-size:.7rem;letter-spacing:.2em}
.pack.tear{animation:tear .6s ease-in forwards}
@keyframes tear{30%{transform:rotate(-4deg) scale(1.05)}100%{transform:translateY(-30px) scale(1.3);opacity:0}}
.odds{font-size:.78rem;color:var(--mute);margin-top:12px;line-height:1.5}.odds i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.hand{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:300px;align-items:center}
.empty{color:var(--mute);font-style:italic;text-align:center;padding:60px 10px}
.slot{perspective:900px;width:150px;height:216px;cursor:pointer;background:none;border:0;padding:0}
.slot:hover:not(:disabled){background:none}
.in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.slot.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px}
.b{background:repeating-linear-gradient(45deg,#13292f 0 8px,#0e1f24 8px 16px);border:2px solid #c9a45c;display:grid;place-items:center;color:#c9a45c;font-size:2rem}
.f{transform:rotateY(180deg)}
.card{--c:#999;width:150px;height:216px;border-radius:8px;border:3px solid var(--c);background:#0d181c;color:#eee;position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;font-size:11px;box-shadow:0 0 0 1px #000,0 6px 16px #0007}
.card .nm{font-family:'Cormorant SC',serif;font-weight:700;font-size:13px;padding:5px 7px 2px;line-height:1.05;min-height:30px}
.card svg.art{width:100%;height:96px;display:block;border-top:1px solid var(--c);border-bottom:1px solid var(--c)}
.card .ty{display:flex;justify-content:space-between;padding:3px 7px;color:var(--c);font-size:10px}
.card .fl{padding:0 7px;font-style:italic;color:#b9c4c4;font-size:10px;line-height:1.25;flex:1}
.card .st{display:flex;justify-content:space-between;padding:3px 7px 5px;font-weight:600}
.card.t3,.card.t4,.card.t5,.card.t6{box-shadow:0 0 14px var(--c),0 0 0 1px #000}

.cnt{position:absolute;top:4px;right:4px;background:#000c;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;z-index:2}
.wrap{position:relative}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
